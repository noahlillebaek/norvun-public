<title id="title">From observations to probabilistic inference</title><desc id="desc">An illustrative research workflow, not a model result.</desc>
<rect width="1160" height="256" rx="14" fill="#101b2b"/><text x="36" y="42" fill="#9cbbd6" font-size="15" font-family="Arial,sans-serif" letter-spacing="2">CONCEPTUAL RESEARCH FRAMEWORK</text>
